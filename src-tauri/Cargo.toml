[package]
name = "buzz"
version = "0.1.3"
description = "Buzz: a Yahoo Messenger revival"
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "buzz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }

# Launching Buzz again raises the running Buddy List instead of starting a second
# copy on the same account (classic Yahoo Messenger behaviour). Official Tauri plugin.
tauri-plugin-single-instance = "2.5"

# The Message private key lives in the OS keychain (buzz-encryption E1.2, ADR 0010).
keyring = "4.2"

# Automatic Now Playing on Linux: reads MPRIS players over D-Bus (buzz-trigger R7).
[target.'cfg(target_os = "linux")'.dependencies]
mpris = "2.1"

# Automatic Now Playing on Windows: reads the system media controls (SMTC) (buzz-trigger R7.7).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Media_Control", "Foundation", "Foundation_Collections", "Win32_System_WinRT"] }

# Debug builds keep line numbers for backtraces but not full variable info.
# A full debug build was 13 GB; this keeps `npm run tauri dev` small.
[profile.dev]
debug = 1
