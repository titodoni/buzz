# Two-user check on Windows (e2e/two-user.mjs): user A in the real Buzz
# desktop app (WebView2, driven by msedgedriver), user B in
# headless Chrome, both on the hosted Supabase project. Started by hand from the
# Actions tab, because every run makes two new throwaway accounts there.
#
# Linux runs it locally instead (see e2e/README.md): a CI Linux runner has no
# keychain, so the app would rightly refuse to send.
name: e2e

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      E2E_ACCOUNTS: .env.e2e.ci
      E2E_FRESH: "1"
      # The check runs below administrator, so it writes only into e2e/out, which it makes.
      E2E_REPORT: e2e/out/report.md
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: An msedgedriver that matches this WebView2
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool --rev 8c4b34f51b45f5cf08013366d703de464ab871d1 --locked
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          $PWD.Path >> $env:GITHUB_PATH

      - name: Build the app (debug, no installer)
        run: npm run tauri build -- --debug --no-bundle

      # Does the app start and keep answering on its own, without any driver?
      - name: Start the app by itself for 20 seconds
        shell: pwsh
        run: |
          $p = Start-Process -FilePath src-tauri/target/debug/buzz.exe -PassThru `
            -RedirectStandardOutput app-out.txt -RedirectStandardError app-err.txt
          Start-Sleep -Seconds 20
          $p.Refresh()
          "Exited: $($p.HasExited)  Responding: $($p.Responding)  Window title: '$($p.MainWindowTitle)'"
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Start-Sleep -Seconds 2
          "--- stdout"; Get-Content app-out.txt -ErrorAction SilentlyContinue
          "--- stderr"; Get-Content app-err.txt -ErrorAction SilentlyContinue

      - name: Make two throwaway accounts
        run: node e2e/setup-accounts.mjs

      # GitHub's Windows runners run elevated, and an elevated WebView2 ignores the
      # WEBVIEW2_* settings msedgedriver uses to attach. Run at normal (Medium)
      # integrity, like a user would (https://zenn.dev/snowcait/articles/113d9c2e972ba5).
      - name: gsudo, to run below administrator
        run: winget install --id gerardog.gsudo --exact --version 2.6.1 --source winget --installer-type wix --silent --accept-package-agreements --accept-source-agreements

      - name: Two-user check
        shell: pwsh
        run: '& "$env:ProgramFiles\gsudo\Current\gsudo.exe" --direct --integrity Medium node e2e/two-user.mjs'

      - name: Report
        if: always()
        shell: pwsh
        run: if (Test-Path e2e/out/report.md) { Get-Content e2e/out/report.md | Add-Content $env:GITHUB_STEP_SUMMARY }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-windows
          path: e2e/out/
          if-no-files-found: ignore
