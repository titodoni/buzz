# Two-user check on Windows (e2e/two-user.mjs): user A in the real Buzz
# desktop app (WebView2, driven by tauri-driver and msedgedriver), user B in
# headless Chrome, both on the hosted Supabase project. Started by hand from the
# Actions tab, because every run makes two new throwaway accounts there.
#
# Linux runs it locally instead (see e2e/README.md): a CI Linux runner has no
# keychain, so the app would rightly refuse to send.
name: e2e

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      E2E_ACCOUNTS: .env.e2e.ci
      E2E_FRESH: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: tauri-driver and an msedgedriver that matches this WebView2
        shell: pwsh
        run: |
          cargo install tauri-driver --locked --version 2.1.0
          cargo install --git https://github.com/chippers/msedgedriver-tool --rev 8c4b34f51b45f5cf08013366d703de464ab871d1 --locked
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          $PWD.Path >> $env:GITHUB_PATH

      - name: Build the app (debug, no installer)
        run: npm run tauri build -- --debug --no-bundle

      - name: Make two throwaway accounts
        run: node e2e/setup-accounts.mjs

      - name: Two-user check
        run: node e2e/two-user.mjs

      - name: Report
        if: always()
        shell: pwsh
        run: if (Test-Path e2e/report.md) { Get-Content e2e/report.md | Add-Content $env:GITHUB_STEP_SUMMARY }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-windows
          path: |
            e2e/report.md
            e2e/out/
          if-no-files-found: ignore
